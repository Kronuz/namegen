name: CI
on:
  push:
    branches: [main, master, 'quest/**']
  pull_request:
  workflow_dispatch:
    inputs:
      nightly: { type: boolean, default: false }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      nightly: ${{ inputs.nightly || false }}
      # Every glibc locale, for namegen_diff's tr_TR.UTF-8 and en_US.ISO8859-1 runs (the
      # Turkish dotted capital I takes the decoding path).
      apt_packages: locales-all
